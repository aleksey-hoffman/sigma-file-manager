[package]
name = "alpha-file-manager"
description = "Alpha File Manager"
version = "3.2.4"
license = "GPL-3.0-or-later"
authors = ["Aleksey Hoffman"]
repository = "https://github.com/aleksey-hoffman/sigma-file-manager"
edition = "2021"
rust-version = "1.90.0"

[workspace]
members = [".", "default-file-manager-common", "default-file-manager-launcher"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sigma_file_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
devtools = []

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = [ "protocol-asset", "tray-icon", "image-png", "devtools"] }
tauri-plugin-log = "~2.4"
tauri-plugin-store = "~2.4"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-os = "~2.4"
tauri-plugin-dialog = "~2.4"
tauri-plugin-global-shortcut = "~2.4"
tauri-plugin-system-fonts = "~2.0"
sysinfo = { version = "0.38", features = ["linux-netdevs"] }
trash = "5.2.6"
base64 = "0.22"
png = "0.18"
file_icon_provider = "1.0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico"] }
lru = "0.18"
once_cell = "1.21"
dirs = "6"
tantivy = "0.26"
walkdir = "2.5"
rayon = "1.12"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
notify = "8"
tauri-plugin-drag = "~2.1"
tauri-plugin-window-state = "~2.4"
tauri-plugin-single-instance = "~2.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
httpdate = "1.0"
futures-util = "0.3"
zip = "8.6"
tar = "0.4"
xz2 = "0.1"
flate2 = "1.1"
sha2 = "0.11"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-autostart = "~2.4"
axum = { version = "0.8", features = ["multipart"] }
mime_guess = "2"
mdns-sd = { version = "0.20", features = ["async"] }
tokio-util = { version = "0.7", features = ["io"] }
# 远程 provider trait 的异步方法包装。MIT OR Apache-2.0，MSRV 远低于本项目的 1.90。
# 选它而不是原生 AFIT：阶段 1 的连接注册表要存 Box<dyn RemoteProvider>，AFIT 不是 dyn 兼容的。
async-trait = "0.1"
urlencoding = "2"
local-ip-address = "0.6"
rcgen = "0.14"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
globset = "0.4.18"
encoding_rs = "0.8"
dunce = "1"
arboard = "3.6.1"
# MCP 服务端 SDK。
#
# 版本必须精确锁定（`=`）：SDK 抬 MSRV 会直接把本项目挡在门外，而 Cargo 只会给
# 一个含糊的编译错误。2026-10-17 全依赖图扫描确认 rmcp 3.5.1 声明 MSRV 1.88，
# 低于本 crate 的 1.90，不再是「零余量」，但升级前仍需重跑扫描。
# 扫描脚本：`.superpowers/sdd/msrv-scan.cjs`（先 cargo metadata 输出到文件再喂给它；
# 别用 PowerShell 管道，Get-Content -Raw 会塞 BOM 导致 JSON.parse 失败）。
#
# 本 crate 的 rust-version 已从 1.88.0 改成 1.90.0：依赖图里 tauri 2.12 全系列
# 声明 MSRV 1.90、gtk/glib 0.22 声明 1.92，1.88 早已不可用，旧声明只是把失败推迟。
rmcp = { version = "=3.5.1", default-features = false, features = [
    "macros",
    "server",
    "transport-streamable-http-server",
] }
uuid = { version = "1", features = ["v4"] }

# TODO: Remove this patch once drag-rs ships a fix for network-path outbound drag on Windows.
# Upstream: https://github.com/crabnebula-dev/drag-rs/issues/72
[patch.crates-io]
drag = { path = "./patches/drag" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
sfm-default-file-manager-common = { path = "default-file-manager-common" }
winreg = "0.56"
roxmltree = "0.21"
webview-com-bindings-core = { package = "windows-core", version = "0.62.2" }
webview2-com = "0.39.1"
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Environment",
    "Win32_Foundation",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Console",
    "Win32_System_Threading",
] }
windows-sys = { version = "0.59", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Environment",
] }
