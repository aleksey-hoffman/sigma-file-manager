[package]
name = "alpha-file-manager"
description = "Alpha File Manager"
version = "3.2.11-beta"
license = "GPL-3.0-or-later"
authors = ["Aleksey Hoffman"]
repository = "https://github.com/aleksey-hoffman/sigma-file-manager"
edition = "2021"
rust-version = "1.90.0"

[workspace]
members = [".", "default-file-manager-common", "default-file-manager-launcher"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sigma_file_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
devtools = []

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = [ "protocol-asset", "tray-icon", "image-png", "devtools"] }
tauri-plugin-log = "~2.4"
tauri-plugin-store = "~2.4"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-os = "~2.4"
tauri-plugin-dialog = "~2.4"
tauri-plugin-global-shortcut = "~2.4"
tauri-plugin-system-fonts = "~2.0"
sysinfo = { version = "0.38", features = ["linux-netdevs"] }
trash = "5.2.6"
base64 = "0.22"
png = "0.18"
file_icon_provider = "1.0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico"] }
lru = "0.18"
once_cell = "1.21"
dirs = "6"
tantivy = "0.26"
walkdir = "2.5"
rayon = "1.12"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "io-util"] }
notify = "8"
tauri-plugin-drag = "~2.1"
tauri-plugin-window-state = "~2.4"
tauri-plugin-single-instance = "~2.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
httpdate = "1.0"
futures-util = "0.3"
zip = "8.6"
tar = "0.4"
xz2 = "0.1"
flate2 = "1.1"
sha2 = "0.11"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-autostart = "~2.4"
axum = { version = "0.8", features = ["multipart"] }
mime_guess = "2"
mdns-sd = { version = "0.20", features = ["async"] }
tokio-util = { version = "0.7", features = ["io"] }
# 远程 provider trait 的异步方法包装。MIT OR Apache-2.0，MSRV 远低于本项目的 1.90。
# 选它而不是原生 AFIT：阶段 1 的连接注册表要存 Box<dyn RemoteProvider>，AFIT 不是 dyn 兼容的。
async-trait = "0.1"
# SOCKS5 客户端 + 假服务端（测试夹具）。MIT，anyip.io 维护。
# TCPBind 由 Socks5Stream::connect_raw(Socks5Command::TCPBind, ...) 使用，供 FTP 被动模式数据通道。
fast-socks5 = "1.0"
urlencoding = "2"
local-ip-address = "0.6"
rcgen = "0.14"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
globset = "0.4.18"
encoding_rs = "0.8"
dunce = "1"
arboard = "3.6.1"
# MCP 服务端 SDK。
#
# 版本必须精确锁定（`=`）：SDK 抬 MSRV 会直接把本项目挡在门外，而 Cargo 只会给
# 一个含糊的编译错误。2026-10-17 全依赖图扫描确认 rmcp 3.5.1 声明 MSRV 1.88，
# 低于本 crate 的 1.90，不再是「零余量」，但升级前仍需重跑扫描。
# 扫描脚本：`.superpowers/sdd/msrv-scan.cjs`（先 cargo metadata 输出到文件再喂给它；
# 别用 PowerShell 管道，Get-Content -Raw 会塞 BOM 导致 JSON.parse 失败）。
#
# 本 crate 的 rust-version 已从 1.88.0 改成 1.90.0：依赖图里 tauri 2.12 全系列
# 声明 MSRV 1.90、gtk/glib 0.22 声明 1.92，1.88 早已不可用，旧声明只是把失败推迟。
rmcp = { version = "=3.5.1", default-features = false, features = [
    "macros",
    "server",
    "transport-streamable-http-server",
] }
uuid = { version = "1", features = ["v4"] }

# SSH 客户端。Apache-2.0，MSRV 1.89（低于本 crate 的 1.90）。
#
# **必须锁 0.63 而不是最新的 0.64**：`russh-sftp 3.0.1` 依赖的是 `russh ^0.63.2`。
# 阶段 2 列远端目录要加 `russh-sftp`，届时如果 russh 是 0.64，依赖树里会同时存在
# 两个 russh，russh-sftp 的 `SftpSession` 类型对不上我们自己实现的 `Handler`，
# 报出来的是一串毫无线索的类型不匹配。所以从一开始就与它对齐。
#
# `default-features = false`：default 带 `aws-lc-rs`，它在 Windows 上要 cmake/nasm。
# 这里只要密码认证，`ring` 足够 —— 本 crate 早就因为 reqwest 用了 ring 版 rustls
# （见上面 rustls 那一行），不会再多编一份。
# 未开 `rsa`：现代 OpenSSH 主机密钥走 ed25519 / ecdsa。若真机 kex 协商失败
# （表现为「连上了但换密钥失败」），再开这个 feature 并用 NAS 实测。
russh = { version = "0.63", default-features = false, features = ["ring"] }
# 阶段 2 的 SFTP provider。**它的 dev-dependency 写的是 `russh = "0.63.2"`**，
# 所以上一行的 0.63 锁是硬约束，不是「暂时这样」——
# 升到 0.64 会让依赖树里同时存在两个 russh，`SftpSession::new` 要的字节流
# 对不上我们自己实现的 `Handler`，报出来是一串没有线索的类型不匹配。
# russh-sftp 只依赖 tokio 一族，本仓早已有，无需新增。
russh-sftp = "3.0.1"

# FTP / FTPS 的 TLS 升级。给「测试连接」把 `TransportStream` 包成 TLS 用。
# 必须用 ring 而不是默认的 aws-lc-rs：后者在 Windows 上要 cmake/nasm，
# 而本 crate 早就因为 reqwest 用了 ring 版 rustls（见上面 rustls 那一行）。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

# TODO: Remove this patch once drag-rs ships a fix for network-path outbound drag on Windows.
# Upstream: https://github.com/crabnebula-dev/drag-rs/issues/72
[patch.crates-io]
drag = { path = "./patches/drag" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "test-util"] }
# FTPS 的假服务端要签一张自签证书，用的是上面 `[dependencies]` 里那个 `rcgen`
# （`lan_share/tls.rs` 早就在用了）。这里**不重复声明** ——
# 测试能用的依赖就是生产能用的依赖，不必为了测试再开一份。

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
sfm-default-file-manager-common = { path = "default-file-manager-common" }
winreg = "0.56"
roxmltree = "0.21"
webview-com-bindings-core = { package = "windows-core", version = "0.62.2" }
webview2-com = "0.39.1"
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Environment",
    "Win32_Foundation",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Console",
    "Win32_System_Threading",
    # 远程凭据的 DPAPI 加解密（CryptProtectData / CryptUnprotectData）。
    "Win32_Security_Cryptography",
] }
windows-sys = { version = "0.59", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Environment",
] }
