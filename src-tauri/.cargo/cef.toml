# Cargo config for the Linux CEF (Chromium) build. Cargo does not load it by itself:
# scripts/tauri-linux-cef.mjs passes it with `--config`, so every other build keeps
# resolving tauri from crates.io.
#
# This takes the whole tauri family and the plugins from the `feat/cef` branches, pinned to a
# commit. Those branches are Tauri 2.x with a separate `tauri-runtime-cef` crate. The tauri
# family must be patched together: two versions of tauri-utils or tauri-build in one graph
# break `generate_context!`.
#
# The commits are from the readest/tauri fork of tauri-apps/tauri@feat/cef (upstream commit
# fe0e5155, CLI 3.0.0-alpha.27) plus four Linux fixes: keyboard focus after Alt-Tab, remote
# debugging on first launch, and no-op wry/x11/dbus features so plugins that enable them
# do not fail.
[patch.crates-io]
tauri = { git = "https://github.com/readest/tauri", rev = "d6ef6e4c755228713e7358a27794a89cfd30969f" }
tauri-build = { git = "https://github.com/readest/tauri", rev = "d6ef6e4c755228713e7358a27794a89cfd30969f" }
tauri-codegen = { git = "https://github.com/readest/tauri", rev = "d6ef6e4c755228713e7358a27794a89cfd30969f" }
tauri-macros = { git = "https://github.com/readest/tauri", rev = "d6ef6e4c755228713e7358a27794a89cfd30969f" }
tauri-plugin = { git = "https://github.com/readest/tauri", rev = "d6ef6e4c755228713e7358a27794a89cfd30969f" }
tauri-runtime = { git = "https://github.com/readest/tauri", rev = "d6ef6e4c755228713e7358a27794a89cfd30969f" }
tauri-runtime-cef = { git = "https://github.com/readest/tauri", rev = "d6ef6e4c755228713e7358a27794a89cfd30969f" }
tauri-utils = { git = "https://github.com/readest/tauri", rev = "d6ef6e4c755228713e7358a27794a89cfd30969f" }

tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-clipboard-manager = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-dialog = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-global-shortcut = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-os = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-window-state = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
